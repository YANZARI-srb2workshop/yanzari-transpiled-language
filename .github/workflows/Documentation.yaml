name: Generate Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download LuaLS 3.19.1
        run: |
          curl -L \
            -o lua-language-server.tar.gz \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz

      - name: Verify LuaLS archive
        run: |
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  lua-language-server.tar.gz" \
            | sha256sum -c -

      - name: Extract LuaLS
        run: |
          mkdir -p "$HOME/luals"
          tar -xzf lua-language-server.tar.gz -C "$HOME/luals"

      - name: Verify LuaLS version
        run: |
          "$HOME/luals/bin/lua-language-server" --version

      - name: Generate documentation
        run: |
          mkdir -p docs
          "$HOME/luals/bin/lua-language-server" \
            --doc=. \
            --doc_out_path=docs

      - name: Commit generated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "No documentation changes detected."
            exit 0
          fi

          git commit -m "[Automatic] generates LuaLS documentation in the doc folder."
          git push